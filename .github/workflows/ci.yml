name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Audit: vulnerabilidades no lockfile (roda no host, sem Docker) ──────────
  audit:
    name: Security audit (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit vulnerabilities
        run: bun audit

  # ─── API: build imagem dev → lint + coverage dentro do container ─────────────
  api:
    name: API (lint + coverage ≥95%)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api (dev target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: dev
          load: true
          tags: fitsync-api:test
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Lint (Biome)
        run: docker run --rm fitsync-api:test sh -c "bun run check"

      # coverage roda em packages/metrics com threshold 95% definido em vitest.config.ts
      # o job falha automaticamente se qualquer métrica cair abaixo de 95%
      - name: Tests + coverage (packages/metrics)
        run: docker run --rm fitsync-api:test sh -c "bun run --filter @fitsync/metrics test:coverage"

  # ─── Sidecar: build imagem dev → pytest dentro do container ─────────────────
  sidecar:
    name: Sidecar (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build sidecar (dev target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/garmin-sidecar/Dockerfile
          target: dev
          load: true
          tags: fitsync-sidecar:test
          cache-from: type=gha,scope=sidecar-dev
          cache-to: type=gha,mode=max,scope=sidecar-dev

      - name: Test sidecar
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            -e ANTHROPIC_API_KEY=sk-ant-placeholder \
            fitsync-sidecar:test uv run pytest tests/ -v --tb=short

  # ─── Validação dos stages de produção (smoke antes de Railway deployar) ─────
  prod-build-check:
    name: Prod build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [audit, api, sidecar]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build sidecar prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/garmin-sidecar/Dockerfile
          target: prod
          cache-from: type=gha,scope=sidecar-prod
          cache-to: type=gha,mode=max,scope=sidecar-prod
