name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Bun: lint + testes TS ──────────────────────────────────────────────────
  bun-check:
    name: Lint + Tests (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run check

      - name: Tests (packages/metrics — 100% coverage obrigatória)
        run: bun run --filter @fitsync/metrics test:coverage

  # ─── Python sidecar: lint + testes ─────────────────────────────────────────
  sidecar-check:
    name: Tests (Python sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: services/garmin-sidecar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder
