name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint + audit + tsc strict + coverage gates ─────────────────────────────
  # Coverage enforcer real em scripts/check-coverage.ts (bun ignora
  # coverageThreshold em bunfig.toml até bun 1.3). Thresholds vivem em env
  # vars — sobem conforme Onda 2/3 adicionam testes.
  quality:
    name: Quality (lint + types + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run check

      # Report-only: expo/react-native arrastam advisories transitivos (ws,
      # undici, shell-quote, tar, uuid…) fixados por eles, que não dá pra
      # corrigir sem quebrar o build mobile. `bun audit` sem filtro falhava em
      # QUALQUER severidade e abortava o job antes do tsc/testes. Mantemos o
      # relatório visível no log, mas ele não bloqueia o merge.
      - name: Audit vulnerabilities (report-only)
        continue-on-error: true
        run: bun audit

      - name: tsc strict (apps/api)
        working-directory: apps/api
        run: ./node_modules/.bin/tsc --noEmit || ../../node_modules/.bin/tsc --noEmit

      - name: tsc strict (apps/mobile)
        working-directory: apps/mobile
        run: ./node_modules/.bin/tsc --noEmit

      - name: Tests + coverage (packages/metrics, gate ≥95%)
        run: bun run --filter @fitsync/metrics test:coverage

      - name: Tests + coverage (apps/api, gate ≥80% — sobe com Onda 2/3)
        working-directory: apps/api
        env:
          COVERAGE_MIN_LINES: "80"
          COVERAGE_MIN_FUNCTIONS: "80"
        run: bun test --coverage 2>&1 | bun run ../../scripts/check-coverage.ts

  # ─── Sidecar Python: pytest + mypy strict via Docker dev image ──────────────
  sidecar:
    name: Sidecar (pytest + mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build sidecar (dev target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/garmin-sidecar/Dockerfile
          target: dev
          load: true
          tags: fitsync-sidecar:test
          cache-from: type=gha,scope=sidecar-dev
          cache-to: type=gha,mode=max,scope=sidecar-dev

      - name: pytest
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            -e ANTHROPIC_API_KEY=sk-ant-placeholder \
            fitsync-sidecar:test uv run pytest tests/ -v --tb=short

      - name: mypy --strict
        run: docker run --rm fitsync-sidecar:test uv run mypy

  # ─── Validação dos stages de produção (smoke antes de Railway deployar) ─────
  prod-build-check:
    name: Prod build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, sidecar]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build sidecar prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/garmin-sidecar/Dockerfile
          target: prod
          cache-from: type=gha,scope=sidecar-prod
          cache-to: type=gha,mode=max,scope=sidecar-prod
