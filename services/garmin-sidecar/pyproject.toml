[project]
name = "garmin-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.0",
    "garminconnect>=0.3.3",
    "cryptography>=48.0.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.15.0",
    "mypy>=1.18.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["garminconnect", "garminconnect.*"]
ignore_missing_imports = true
